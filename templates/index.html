<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joschat</title>

  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div id="app">
    <div id="auth-panel">
      <div class="lockup">
        <svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="#2563eb" />
          <path d="M38 46 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
          <rect x="34" y="46" width="32" height="24" rx="4" fill="#e2e8f0" />
          <circle cx="50" cy="58" r="3.5" fill="#2563eb" />
        </svg>
        <h1>Joschat</h1>
      </div>
      <p class="eyebrow">end-to-end encrypted, verified block by block</p>

      <div class="card">
        <div class="tabs">
          <button type="button" id="tab-login" class="active" onclick="setMode('login')">Log in</button>
          <button type="button" id="tab-register" onclick="setMode('register')">Create account</button>
        </div>

        <div class="field hidden" id="field-username">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" placeholder="yourname" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            minlength="6"
            placeholder="At least 6 characters"
            onkeydown="if(event.key==='Enter') submitAuth()"
          />
        </div>

        <button type="button" class="btn-primary" id="submit-btn" onclick="submitAuth()">Log in</button>
        <p class="status-line" id="auth-status"></p>
      </div>
    </div>

    <div id="chat-panel" class="card hidden">
      <p>Signed in as <strong id="whoami"></strong></p>
      <input id="conversation-id" type="number" placeholder="Conversation ID" />
      <button onclick="openConversation()">Open Conversation</button>

      <ul id="messages"></ul>

      <input id="message-text" type="text" placeholder="Type a message..." />
      <input id="media-file" type="file" />
      <button onclick="sendMessage()">Send</button>
      <button onclick="verifyChain()">Verify This Conversation's Integrity</button>
      <p id="verify-result"></p>
    </div>
  </div>

  <script src="/static/js/background.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/sw.js");
    }
  </script>
</body>
</html>

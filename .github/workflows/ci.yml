name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    # A throw-away Postgres so tests/test_schema_integration.py can exercise
    # supabase/schema.sql (add_block / validate_chain / privileges) for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joschat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py api routes utils blockchain.py config.py extensions.py

      - name: Validate imports
        env:
          FLASK_ENV: testing
          SECRET_KEY: github-actions-test-secret
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-key
          DATABASE_URL: sqlite:///ci.db
        run: |
          python - <<'PY'
          import app
          import blockchain
          import config
          import extensions
          import routes.auth
          import routes.admin
          import routes.calls
          import routes.conversations
          import routes.media
          import routes.messages
          print('Imports OK')
          PY

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joschat_test
        run: pytest -q

      # The browser-side encryption (static/js/crypto.js) also runs under Node, so its
      # key agreement, tamper detection and validation are tested on every push.
      - name: Test browser encryption (Node)
        run: |
          node --version
          node --test tests/js/crypto.test.js
